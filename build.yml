name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --stacktrace
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
      # Mirror ke Google Drive Dagano (My Drive, Anyone with link) — gratis, untuk klien download via dagano.id/apk
      # Butuh secret RCLONE_CONFIG_BASE64 (cat ~/.config/rclone/rclone.conf | base64 -w0) + folder Dagano POS Releases sudah di-share Anyone with link
      - name: Mirror APK to Drive Dagano
        if: github.ref == 'refs/heads/main' && secrets.RCLONE_CONFIG_BASE64 != ''
        run: |
          curl https://rclone.org/install.sh | sudo bash
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 --decode > rclone.conf
          rclone copy app/build/outputs/apk/debug/*.apk gdrive:Dagano-POS-Releases --config=rclone.conf --drive-chunk-size 32M -v
          echo "Drive mirror done — link tetap: https://drive.google.com/drive/folders/<FOLDER_ID> atau https://dagano.id/apk"
